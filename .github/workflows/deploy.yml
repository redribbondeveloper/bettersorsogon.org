name: Deploy

# Auto-deploys main to S3 + CloudFront. Requires two repository secrets
# (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# Use a least-privilege IAM user scoped to this bucket + distribution only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: bettersorsogon-org
  DIST_ID: E3OCHBG6OAGXS5
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS secrets not configured — skipping deploy."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.present == 'true'
        run: npm ci
      - if: steps.creds.outputs.present == 'true'
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.present == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync to S3 (cache tiers)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws s3 sync dist "s3://$BUCKET" \
            --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=86400" --delete
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,must-revalidate"
      - name: Invalidate CloudFront
        if: steps.creds.outputs.present == 'true'
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"
